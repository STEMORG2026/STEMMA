name: Pages — family site (explorer + exports)

# Read-only public site for family/testers (ADR-0054): the static 3D explorer
# plus the published knowledge exports. No server, no keys, no accounts.
# Served at https://stemorg2026.github.io/STEMMA/ (repo moved from the
# Er-Sajan-PLG account; Pages was re-enabled at the org on 2026-10-01).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      # Fail closed: never publish an export that consumers can't load.
      - name: Validate exports with the consumer adapter
        run: |
          set -euo pipefail
          for f in exports/knowledge.json exports/consumers/*/knowledge.*.json; do
            PYTHONPATH=adapters/python python -m stemma_adapter validate "$f"
          done
          pip install -q pyyaml
          python scripts/export_consumers.py --all --check

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: explorer/package-lock.json

      - name: Install explorer dependencies
        working-directory: explorer
        run: npm ci

      - name: Verify graph projection
        working-directory: explorer
        run: npm run verify

      - name: Build explorer for /STEMMA/
        working-directory: explorer
        env:
          STEMMA_BASE: /STEMMA/
        run: npm run build

      # Publish the real knowledge exports only (not embeddings/vector_store).
      - name: Assemble site
        run: |
          set -euo pipefail
          mkdir -p explorer/dist/exports
          cp exports/knowledge*.json exports/knowledge.jsonld explorer/dist/exports/
          for f in exports/consumers/*/knowledge.*.json; do
            d="explorer/dist/exports/consumers/$(basename "$(dirname "$f")")"
            mkdir -p "$d" && cp "$f" "$d/"
          done
          touch explorer/dist/.nojekyll
          test -s explorer/dist/index.html
          test -s explorer/dist/exports/knowledge.json
          grep -q '/STEMMA/assets/' explorer/dist/index.html
          ls -la explorer/dist explorer/dist/exports

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: explorer/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
